<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jev Puyo Battle</title><link rel="stylesheet" href="battle.css"></head>
<body><main>
  <header><div><p>JEV PUYO LAB / VERSUS</p><h1>POLICY <span>BATTLE</span></h1></div><a href="/">← SOLO LAB</a></header>
  <section class="setup">
    <div><label>1P PLAYER</label><select id="p1-mode"><option value="heuristic">HEURISTIC</option><option value="direct">JEV DIRECT</option><option value="jury">JEV JURY</option></select><select id="p1-strategy"><option value="chain">10-CHAIN</option><option value="balanced">BALANCED</option><option value="clear">QUICK CLEAR</option><option value="survive">SURVIVAL</option></select></div>
    <div class="center"><label>SEED</label><input id="seed" type="number" value="4242"><button id="start">START BATTLE</button><button id="pause">PAUSE</button></div>
    <div><label>2P PLAYER</label><select id="p2-mode"><option value="direct">JEV DIRECT</option><option value="heuristic">HEURISTIC</option><option value="jury">JEV JURY</option></select><select id="p2-strategy"><option value="chain">10-CHAIN</option><option value="balanced">BALANCED</option><option value="clear">QUICK CLEAR</option><option value="survive">SURVIVAL</option></select></div>
  </section>
  <section class="arena">
    <article class="fighter p1"><div class="name"><b>1P</b><span id="p1-status">READY</span></div><canvas id="p1-board" width="300" height="600"></canvas><div class="stats"><span>SCORE <b id="p1-score">0</b></span><span>CHAIN <b id="p1-chain">0</b></span><span>OJAMA <b id="p1-garbage">0</b></span></div><p id="p1-decision">—</p></article>
    <div class="versus"><strong>VS</strong><span id="round">ROUND 0</span><div id="attack">同じぷよ列で対戦</div></div>
    <article class="fighter p2"><div class="name"><b>2P</b><span id="p2-status">READY</span></div><canvas id="p2-board" width="300" height="600"></canvas><div class="stats"><span>SCORE <b id="p2-score">0</b></span><span>CHAIN <b id="p2-chain">0</b></span><span>OJAMA <b id="p2-garbage">0</b></span></div><p id="p2-decision">—</p></article>
    <div id="result" class="result hidden"></div>
  </section>
  <section class="trace"><h2>BATTLE TRACE</h2><div id="log"></div></section>
</main><script type="module" src="battle.js"></script></body></html>
